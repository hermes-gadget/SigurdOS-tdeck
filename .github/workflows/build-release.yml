name: Build & Release

"on":
  push:
    tags: ['*']
  workflow_dispatch:

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run native tests
        run: pio test -e native_test -v

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        env: [SigurdOS_TDeck, SigurdOS_TDeck_debug, SigurdOS_TDeck_ble, SigurdOS_TDeck_ble_validation]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Determine artifact name
        id: artifact_name
        run: |
          if [ "${{ matrix.env }}" = "SigurdOS_TDeck" ]; then
            echo "name=sigurdos-tdeck-firmware" >> "$GITHUB_OUTPUT"
          else
            echo "name=sigurdos-tdeck-firmware-${{ matrix.env }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware-merged.bin
          if-no-files-found: warn

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download primary firmware
        uses: actions/download-artifact@v4
        with:
          name: sigurdos-tdeck-firmware
          path: primary

      - name: Download debug firmware
        uses: actions/download-artifact@v4
        with:
          name: sigurdos-tdeck-firmware-SigurdOS_TDeck_debug
          path: debug

      - name: Download BLE firmware
        uses: actions/download-artifact@v4
        with:
          name: sigurdos-tdeck-firmware-SigurdOS_TDeck_ble
          path: ble

      - name: Download BLE validation firmware
        uses: actions/download-artifact@v4
        with:
          name: sigurdos-tdeck-firmware-SigurdOS_TDeck_ble_validation
          path: ble_validation

      - name: Prepare release assets
        run: |
          mkdir -p artifacts
          cp primary/* artifacts/ 2>/dev/null || true
          cp -r debug/* artifacts/debug/ 2>/dev/null || true
          cp -r ble/* artifacts/ble/ 2>/dev/null || true
          cp -r ble_validation/* artifacts/ble_validation/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            **SigurdOS T-Deck Firmware** — ${{ github.ref_name }}

            ### Variants

            | Variant | Description |
            |---------|-------------|
            | `SigurdOS_TDeck` | Primary firmware (production) |
            | `SigurdOS_TDeck_debug` | Debug build with verbose diagnostics |
            | `SigurdOS_TDeck_ble` | BLE companion mode for mobile app |
            | `SigurdOS_TDeck_ble_validation` | BLE with validation harness |

            ### Flash with esptool
            ```bash
            # Full flash (first install):
            esptool.py --chip esp32s3 --port /dev/ttyACM0 write_flash 0x0 firmware-merged.bin

            # App update (keep settings):
            esptool.py --chip esp32s3 --port /dev/ttyACM0 \
              write_flash 0x10000 firmware.bin
            ```

            ### Web Flasher
            Use the manifest at `webflasher/manifest.json` with [esptool.js](https://espressif.github.io/esptool-js/).

            | File | Use |
            |------|-----|
            | `firmware.bin` | App only (flash at 0x10000) |
            | `firmware-merged.bin` | Full flash (flash at 0x0) |
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/firmware.bin
            artifacts/firmware-merged.bin
            artifacts/debug/firmware.bin
            artifacts/debug/firmware-merged.bin
            artifacts/ble/firmware.bin
            artifacts/ble/firmware-merged.bin
            artifacts/ble_validation/firmware.bin
            artifacts/ble_validation/firmware-merged.bin
