name: Refresh PlatformIO dependency

"on":
  workflow_dispatch:
    inputs:
      dependency:
        description: Exact application-level dependency to update
        required: true
        type: choice
        options:
          - RadioLib
          - Crypto
          - RTClib
          - Melopero-RV3028
          - CayenneLPP
          - ArduinoJson
      version:
        description: Exact registry version (no ranges)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev with MeshCore
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: dev
          submodules: recursive

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'

      - name: Restore immutable PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'lib/meshcore/library.json', 'ci/requirements-platformio.txt') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install pinned tooling
        run: python -m pip install --require-hashes -r ci/requirements-platformio.txt

      - name: Update one exact pin and resolve the graph
        run: |
          python scripts/update_pio_dependency.py "${{ inputs.dependency }}" "${{ inputs.version }}"
          pio pkg install -e SigurdOS_TDeck
          python scripts/platformio_lock.py --write

      - name: Open reviewed dependency PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: dev
          branch: deps/${{ inputs.dependency }}-${{ inputs.version }}
          commit-message: "chore(deps): update ${{ inputs.dependency }} to ${{ inputs.version }}"
          title: "chore(deps): update ${{ inputs.dependency }} to ${{ inputs.version }}"
          body: |
            Updates one exact PlatformIO dependency pin.

            The accompanying `ci/platformio-packages.lock` change is the reviewed
            resolved-graph diff. Normal PR CI performs the build and native tests.
          labels: dependencies
          delete-branch: true
