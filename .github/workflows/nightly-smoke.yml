name: Nightly Smoke Matrix

"on":
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Env smoke matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: recursive

      - name: Check MeshCore lock and remote pin
        run: python3 scripts/check_meshcore_pin.py --check-remote

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.11'

      - name: Restore PlatformIO packages
        uses: ./.github/actions/cache-platformio
        with:
          dependency-hash: ${{ hashFiles('platformio.ini', 'lib/meshcore/library.json', 'ci/requirements-platformio.in', 'ci/requirements-platformio.txt', 'ci/platformio-packages.lock') }}

      - name: Install PlatformIO
        run: python -m pip install --require-hashes -r ci/requirements-platformio.txt

      - name: Resolve exact firmware packages
        run: pio pkg install -e SigurdOS_TDeck

      - name: Verify resolved PlatformIO graph
        run: python scripts/platformio_lock.py --check --environment SigurdOS_TDeck

      - name: Run smoke build matrix
        run: python scripts/smoke_build_matrix.py --profile roadmap
