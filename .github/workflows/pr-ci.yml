name: Pull Request CI

"on":
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platformio:
    name: PlatformIO tests and firmware build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      # Run native tests first for fast feedback
      - name: Run native tests
        run: pio test -e native_test -v

      # Firmware builds run in parallel after tests pass
      - name: Build SigurdOS_TDeck firmware
        run: pio run -e SigurdOS_TDeck

      - name: Build SigurdOS_TDeck_debug firmware
        run: pio run -e SigurdOS_TDeck_debug

      - name: Build SigurdOS_TDeck_ble firmware
        run: pio run -e SigurdOS_TDeck_ble

      - name: Build SigurdOS_TDeck_ble_validation firmware
        run: pio run -e SigurdOS_TDeck_ble_validation
