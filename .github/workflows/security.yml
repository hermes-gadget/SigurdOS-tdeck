name: Security Scanning

"on":
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit and inventories
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check MeshCore lock and remote pin
        run: python3 scripts/check_meshcore_pin.py --check-remote

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            scripts/official-meshcore-client-test/package-lock.json
            scripts/font-tools/package-lock.json

      - name: Install official client dependencies
        working-directory: scripts/official-meshcore-client-test
        run: npm ci

      - name: Audit official client dependencies
        working-directory: scripts/official-meshcore-client-test
        run: npm audit --omit=dev --audit-level=high

      - name: Generate npm CycloneDX SBOM
        working-directory: scripts/official-meshcore-client-test
        run: >-
          npm sbom --sbom-format cyclonedx --omit=dev
          > "${{ runner.temp }}/official-client-sbom.cdx.json"

      - name: Reproduce checked-in font assets
        run: |
          npm ci --ignore-scripts --prefix scripts/font-tools
          FONT_OUTPUT_DIR="${{ runner.temp }}/fonts" scripts/generate_emoji_font.sh
          FONT_OUTPUT_DIR="${{ runner.temp }}/fonts" scripts/generate_latin_ext_font.sh
          FONT_OUTPUT_DIR="${{ runner.temp }}/fonts" scripts/generate_keyboard_layout_font.sh
          FONT_OUTPUT_DIR="${{ runner.temp }}/fonts" scripts/generate_montserrat_8_font.sh
          cmp src/fonts/emoji_font.c "${{ runner.temp }}/fonts/emoji_font.c"
          cmp src/fonts/latin_ext_font.c "${{ runner.temp }}/fonts/latin_ext_font.c"
          cmp src/fonts/keyboard_layout_font.c "${{ runner.temp }}/fonts/keyboard_layout_font.c"
          cmp src/fonts/montserrat_8.c "${{ runner.temp }}/fonts/montserrat_8.c"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.11'

      - name: Restore PlatformIO packages
        uses: ./.github/actions/cache-platformio
        with:
          dependency-hash: ${{ hashFiles('platformio.ini', 'lib/meshcore/library.json', 'ci/requirements-platformio.in', 'ci/requirements-platformio.txt', 'ci/platformio-packages.lock') }}

      - name: Resolve and checksum-verify PlatformIO dependencies
        run: |
          python -m pip install --require-hashes -r ci/requirements-platformio.txt
          pio pkg install --force -e SigurdOS_TDeck
          pio pkg list -e SigurdOS_TDeck > "${{ runner.temp }}/platformio-dependencies.txt"

      - name: Verify resolved PlatformIO graph
        run: python scripts/platformio_lock.py --check --environment SigurdOS_TDeck

      - name: Generate firmware CycloneDX SBOM
        run: >-
          python scripts/generate_platformio_sbom.py
          --output "${{ runner.temp }}/platformio-sbom.cdx.json"

      - name: Verify immutable WebServer security fixes
        run: >-
          python scripts/check_security_patches.py
          --framework-root
          ~/.platformio/packages/framework-arduinoespressif32
          --overlay-root lib/WebServer

      - name: Build canonical firmware from clean dependencies
        run: pio run -e SigurdOS_TDeck

      - name: Install checksum-pinned OSV Scanner
        env:
          OSV_URL: https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          OSV_SHA256: bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc
        run: |
          curl --fail --location --silent --show-error "$OSV_URL" -o "${{ runner.temp }}/osv-scanner"
          echo "$OSV_SHA256  ${{ runner.temp }}/osv-scanner" | sha256sum --check
          chmod +x "${{ runner.temp }}/osv-scanner"

      - name: Scan firmware SBOM and vendored sources for vulnerabilities
        run: |
          "${{ runner.temp }}/osv-scanner" scan source \
            --config ci/osv-scanner.toml \
            --lockfile "${{ runner.temp }}/platformio-sbom.cdx.json" \
            --recursive --include-git-root \
            --format json --output-file "${{ runner.temp }}/osv-results.json" \
            lib \
            .pio/libdeps/SigurdOS_TDeck/Crypto \
            ".pio/libdeps/SigurdOS_TDeck/Melopero RV3028" \
            .pio/libdeps/SigurdOS_TDeck/WebSockets

      - name: Upload dependency inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-inventories
          path: |
            ${{ runner.temp }}/official-client-sbom.cdx.json
            ${{ runner.temp }}/platformio-dependencies.txt
            ${{ runner.temp }}/platformio-sbom.cdx.json
            ${{ runner.temp }}/osv-results.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL C/C++ SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:c-cpp
