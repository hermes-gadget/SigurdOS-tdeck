name: Security Scanning

"on":
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit and inventories
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Check MeshCore lock and remote pin
        run: python3 scripts/check_meshcore_pin.py --check-remote

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/official-meshcore-client-test/package-lock.json

      - name: Install official client dependencies
        working-directory: scripts/official-meshcore-client-test
        run: npm ci

      - name: Audit official client dependencies
        working-directory: scripts/official-meshcore-client-test
        run: npm audit --omit=dev --audit-level=high

      - name: Generate npm CycloneDX SBOM
        working-directory: scripts/official-meshcore-client-test
        run: >-
          npm sbom --sbom-format cyclonedx --omit=dev
          > "${{ runner.temp }}/official-client-sbom.cdx.json"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.11'

      - name: Restore PlatformIO packages
        uses: ./.github/actions/cache-platformio
        with:
          dependency-hash: ${{ hashFiles('platformio.ini', 'lib/meshcore/library.json', 'ci/requirements-platformio.in', 'ci/requirements-platformio.txt', 'ci/platformio-packages.lock') }}

      - name: Resolve PlatformIO dependencies
        run: |
          python -m pip install --require-hashes -r ci/requirements-platformio.txt
          pio pkg install -e SigurdOS_TDeck
          pio pkg list -e SigurdOS_TDeck > "${{ runner.temp }}/platformio-dependencies.txt"

      - name: Verify resolved PlatformIO graph
        run: python scripts/platformio_lock.py --check

      - name: Upload dependency inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventories
          path: |
            ${{ runner.temp }}/official-client-sbom.cdx.json
            ${{ runner.temp }}/platformio-dependencies.txt
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL C/C++ SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          languages: c-cpp
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          category: /language:c-cpp
