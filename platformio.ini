; PlatformIO Project Configuration — SlopOS T-Deck Firmware
; Target: LilyGo T-Deck (ESP32-S3 + ST7789 320x240 + SX1262 LoRa)
; Framework: Arduino, GUI: LVGL v9, Mesh networking: MeshCore (submodule at lib/meshcore)

[platformio]
src_dir = src
include_dir = src

[common]
framework = arduino
monitor_speed = 115200
board = t-deck

build_flags_common =
  -Wall -Wextra -Wno-unused-parameter
  -D NDEBUG
  -D SLOPOS_TDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=0  ; Let USB settle after flash before claiming CDC endpoint
  -D LV_CONF_INCLUDE_SIMPLE=1
  ; MeshCore / RadioLib flags
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  ; Strip unused Radiolib modules
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  ; SX1262 hardware config (matches MeshCore T-Deck variant)
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f

lib_deps_common =
  SPI
  Wire
  jgromes/RadioLib @ ^7.6.0
  rweather/Crypto @ ^0.4.0
  lovyan03/LovyanGFX @ ^1.2.0
  lvgl/lvgl @ 9.3.0
  adafruit/Adafruit BusIO @ ^1.16.1

[env:SlopOS_TDeck]
platform = platformio/espressif32@6.11.0
framework = ${common.framework}
board = ${common.board}
board_build.flash_mode = qio
monitor_speed = ${common.monitor_speed}
monitor_filters = esp32_exception_decoder
build_flags =
  ${common.build_flags_common}
  -D ESP32_PLATFORM
  ; SlopOS source includes
  -I src
  -I src/hal
  -I src/ui
  -I src/mesh
  -I src/app
  -I src/utils
  -I src/fonts
  -I src/diagnostics
  ; MeshCore sub-library includes (nested libs)
  -I lib/meshcore/lib/ed25519
  -I src/mesh   ; for slop_mesh.h
build_src_filter =
  +<*.cpp>
  +<hal/*.cpp>
  +<ui/*.cpp>
  +<mesh/*.cpp>
  +<app/*.cpp>
  +<utils/*.cpp>
  +<fonts/*.cpp>
  +<fonts/*.c>
  +<diagnostics/*.cpp>
  +<../lib/meshcore/lib/ed25519/*.c>
lib_deps =
  ${common.lib_deps_common}
  file://lib/meshcore
extra_scripts =
  post:scripts/merge_bin.py

[env:SlopOS_TDeck_trackball_debug]
extends = env:SlopOS_TDeck
build_flags =
  ${env:SlopOS_TDeck.build_flags}
  -D SLOPOS_TRACKBALL_DEBUG=1
  -D SLOPOS_TRACKBALL_DEBUG_SHADOW=1

[env:SlopOS_TDeck_debug]
extends = env:SlopOS_TDeck
build_flags =
  ${env:SlopOS_TDeck.build_flags}
  -D SLOPOS_DEBUG=1

[env:native_test]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
  -std=c++17
  -I src
  -I src/hal
  -I src/ui
  -I src/mesh
  -I src/app
  -I src/utils
  -I src/fonts
  -I test/mocks
lib_deps =
  google/googletest @ 1.17.0
lib_ignore =
  MeshCore
build_src_filter =
  -<*>
  +<../test/mocks/mock_arduino.cpp>
  +<../test/mocks/mock_mesh_wrapper.cpp>
  +<../test/mocks/mock_prefs.cpp>
  +<hal/keyboard.cpp>
  +<hal/trackball.cpp>
