; PlatformIO Project Configuration — SigurdOS T-Deck Firmware
; Target: LilyGo T-Deck (ESP32-S3 + ST7789 320x240 + SX1262 LoRa)
; Framework: Arduino, GUI: LVGL v9, Mesh networking: MeshCore (submodule at lib/meshcore)

[platformio]
src_dir = src
include_dir = src

[common]
framework = arduino
monitor_speed = 115200
board = t-deck

build_flags_common =
  -Wall -Wextra -Wno-unused-parameter
  -DNDEBUG
  -D SIGURDOS_TDECK
  -D BOARD_HAS_PSRAM=1
  -DCORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1  ; Route Serial through USB CDC (/dev/ttyACM0) instead of UART0 pins 43/44
  -D LV_CONF_INCLUDE_SIMPLE=1
  -D LODEPNG_NO_COMPILE_ALLOCATORS=1
  ; MeshCore / RadioLib flags
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -DLORA_FREQ=869.618
  -DLORA_BW=62.5
  -DLORA_SF=8
  -DLORA_CR=5
  -DLORA_TX_PWR=22
  -DLORA_TX_POWER=22
  ; SX1262 pin definitions (MeshCore compile-time visibility)
  -D P_LORA_NSS=9
  -D P_LORA_DIO_1=45
  -D P_LORA_RESET=17
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=38
  -D P_LORA_MOSI=41
  ; Strip unused Radiolib modules
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  ; SX1262 hardware config (matches MeshCore T-Deck variant)
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  ; BaseChatMesh build flags
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=8
  -D SIGURDOS_SECURITY_EPOCH=1

lib_deps_common =
  SPI
  Wire
  jgromes/RadioLib @ 7.7.1
  rweather/Crypto @ 0.4.0
  lovyan03/LovyanGFX @ 1.2.21
  ; The PlatformIO registry archive for 9.3.0 has been served without the
  ; lv_sprintf sources. Pin the immutable upstream commit so fresh envs get
  ; the complete release tree.
  https://github.com/lvgl/lvgl/archive/c033a98afddd65aaafeebea625382a94020fe4a7.zip
  adafruit/Adafruit BusIO @ 1.17.4
  ; Pin MeshCore's transitive registry libraries at the application boundary.
  adafruit/RTClib @ 2.1.4
  melopero/Melopero RV3028 @ 1.2.0
  electroniccats/CayenneLPP @ 1.6.1
  bblanchon/ArduinoJson @ 7.4.3
  file://lib/WebServer

; Debug and validation environments inherit the product configuration but replace
; its release-only compiler controls. Keep these exact spellings in sync with the
; corresponding common flags so PlatformIO can remove them deterministically.
[debug]
build_unflags =
  -Os
  -DNDEBUG
  -DCORE_DEBUG_LEVEL=1
build_flags =
  -Og
  -UNDEBUG
  ; Level 2 = warnings+errors+info. Level 5 floods BLE getAdvertising()/GATT
  ; verbose logs every mesh poll and makes capture/soak serial unusable.
  -DCORE_DEBUG_LEVEL=2

[env:SigurdOS_TDeck]
platform = platformio/espressif32@7.0.1
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  platformio/tool-esptoolpy@2.41100.0
framework = ${common.framework}
board = ${common.board}
board_build.flash_mode = dio
board_build.partitions = partitions_sigurdos_16MB.csv
board_build.sdkconfig_path = sdkconfig.defaults
monitor_speed = ${common.monitor_speed}
monitor_filters = esp32_exception_decoder
build_flags =
  ${common.build_flags_common}
  -D ESP32_PLATFORM
  -D SIGURDOS_OTA_HEALTH_WINDOW_MS=30000UL
  -DSIGURDOS_COMPANION_BLE=1
  ; SigurdOS source includes
  -I src
  -I src/hal
  -I src/ui
  -I src/mesh
  -I src/comms
  -I src/app
  -I src/utils
  -I src/fonts
  -I src/diagnostics
  ; QR code library
  -I lib/qrcode
  ; MeshCore sub-library includes (nested libs)
  -I lib/base64
  -I lib/meshcore/lib/ed25519
  -I src/mesh   ; for slop_mesh.h
build_src_filter =
  +<*.cpp>
  +<hal/*.cpp>
  +<ui/*.cpp>
  +<ui/screens/*.cpp>
  +<mesh/*.cpp>
  +<comms/*.cpp>
  +<app/*.cpp>
  +<utils/*.cpp>
  +<fonts/*.cpp>
  +<fonts/*.c>
  +<diagnostics/*.cpp>
  +<hal/wifi_ota.cpp>
  +<../lib/meshcore/lib/ed25519/*.c>
  +<../lib/qrcode/*.c>
  +<../lib/meshcore/src/helpers/esp32/SerialBLEInterface.cpp>
lib_deps =
  ${common.lib_deps_common}
  file://lib/meshcore
extra_scripts =
  pre:scripts/arduino_hwcdc_fix.py
  pre:scripts/check_security_patches.py
  pre:scripts/build_metadata.py
  post:scripts/stamp_security_epoch.py
  post:scripts/merge_bin.py

[env:SigurdOS_TDeck_ble_validation]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_COMPANION_BLE_VALIDATION=1

# Agent-driven BLE companion testing: radio + remote test controller + BLE validation
# telemetry. Serial commands: `ble status|on|off|pin`. Host client on hermes-pi uses
# the open-source meshcore Python package (same companion protocol as Liam Cottle's app).
[env:SigurdOS_TDeck_ble_agent]
extends = env:SigurdOS_TDeck_remote_test_radio
build_flags =
  ${env:SigurdOS_TDeck_remote_test_radio.build_flags}
  -D SIGURDOS_COMPANION_BLE_VALIDATION=1

[env:SigurdOS_TDeck_meshv2]
extends = env:SigurdOS_TDeck
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  -D SIGURDOS_MESH_V2=1

[env:SigurdOS_TDeck_trackball_debug]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_TRACKBALL_DEBUG=1
  -D SIGURDOS_TRACKBALL_DEBUG_SHADOW=1

[env:SigurdOS_TDeck_debug]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
board_build.sdkconfig_path = sdkconfig.debug
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_DEBUG=1
  -D SIGURDOS_CRASH_RING=1
  -D SIGURDOS_DEBUG_DISPLAY=1
  -D SIGURDOS_DEBUG_MESH=1
  -D SIGURDOS_DEBUG_UI=1
  -D SIGURDOS_DEBUG_MAP=1
  -D SIGURDOS_DEBUG_DIAG=1

[env:SigurdOS_TDeck_debug_869]
extends = env:SigurdOS_TDeck_debug
build_unflags =
  ${env:SigurdOS_TDeck_debug.build_unflags}
  -DLORA_FREQ=869.618
  -DLORA_BW=62.5
  -DLORA_SF=8
build_flags =
  ${env:SigurdOS_TDeck_debug.build_flags}
  -DLORA_FREQ=869.525f
  -DLORA_BW=250.0f
  -DLORA_SF=10

# Per-feature debug envs — enable just one feature's debug output.
# Build with: pio run -e SigurdOS_TDeck_debug_display

[env:SigurdOS_TDeck_debug_display]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_DEBUG_DISPLAY=1

[env:SigurdOS_TDeck_debug_mesh]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_DEBUG_MESH=1

[env:SigurdOS_TDeck_debug_ui]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_DEBUG_UI=1

[env:SigurdOS_TDeck_debug_map]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_DEBUG_MAP=1

[env:SigurdOS_TDeck_debug_diag]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_DEBUG_DIAG=1

# Structured telemetry + remote test for AI agents — full command suite.
# Build: pio run -e SigurdOS_TDeck_telemetry
[env:SigurdOS_TDeck_telemetry]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_TELEMETRY=1
  -D SIGURDOS_REMOTE_TEST=1
build_src_filter =
  ${env:SigurdOS_TDeck.build_src_filter}
  +<test/*.cpp>

# Telemetry with diff-based updates (bandwidth-efficient).
[env:SigurdOS_TDeck_telemetry_diff]
extends = env:SigurdOS_TDeck_telemetry
build_flags =
  ${env:SigurdOS_TDeck_telemetry.build_flags}
  -D SIGURDOS_TELEMETRY_DIFF=1

# Remote test mode - serial UI/input automation over USB CDC.
# No LoRa radio driver is initialized unless SIGURDOS_REMOTE_TEST_RADIO=1.
# Shared board state and SPI bus are still initialized for dependent peripherals.
# See src/test/test_controller.cpp for available commands.
[env:SigurdOS_TDeck_remote_test]
extends = env:SigurdOS_TDeck_debug
build_unflags =
  ${env:SigurdOS_TDeck_debug.build_unflags}
  -DLORA_FREQ=869.618
  -DLORA_BW=62.5
  -DLORA_SF=8
build_flags =
  ${env:SigurdOS_TDeck_debug.build_flags}
  -D SIGURDOS_REMOTE_TEST=1
  -D SIGURDOS_DEBUG_FORCE_RADIO_PARAMS
  -DLORA_FREQ=869.525f
  -DLORA_BW=250.0f
  -DLORA_SF=10
build_src_filter =
  ${env:SigurdOS_TDeck.build_src_filter}
  +<test/*.cpp>

# Remote test WITH radio — test controller + full LoRa mesh.
# For bidirectional radio verification (T-Deck ↔ Heltec V3).
[env:SigurdOS_TDeck_remote_test_radio]
extends = env:SigurdOS_TDeck_remote_test
build_flags =
  ${env:SigurdOS_TDeck_remote_test.build_flags}
  -D SIGURDOS_REMOTE_TEST_RADIO=1
  -D SIGURDOS_DEBUG_MESH=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1

[env:SigurdOS_TDeck_remote_test_radio_testfreq]
extends = env:SigurdOS_TDeck_remote_test_radio

# Remote test WITH radio — 869.525 MHz / SF11 / BW250 / CR5 (for RoomServer testing)
[env:SigurdOS_TDeck_remote_test_radio_roomtest]
extends = env:SigurdOS_TDeck_remote_test
build_unflags =
  ${env:SigurdOS_TDeck_remote_test.build_unflags}
  -DLORA_SF=10
build_flags =
  ${env:SigurdOS_TDeck_remote_test.build_flags}
  -D SIGURDOS_REMOTE_TEST_RADIO=1
  -D MESH_DEBUG=1
  -D MESH_PACKET_LOGGING=1
  -DLORA_SF=11

# Remote test WITH radio — USA/Canada 902-928 MHz validation profile.
[env:SigurdOS_TDeck_remote_test_radio_usca]
extends = env:SigurdOS_TDeck_remote_test_radio
build_unflags =
  ${env:SigurdOS_TDeck_debug.build_unflags}
  -DLORA_FREQ=869.618
  -DLORA_BW=62.5
  -DLORA_FREQ=869.525f
  -DLORA_BW=250.0f
  -DLORA_SF=10
build_flags =
  ${env:SigurdOS_TDeck_remote_test_radio.build_flags}
  -DLORA_FREQ=915.000f
  -DLORA_BW=62.5f

# Remote test WITH radio — USA/Canada RX-only validation profile.
[env:SigurdOS_TDeck_remote_test_radio_usca_rxonly]
extends = env:SigurdOS_TDeck_remote_test_radio_usca
build_flags =
  ${env:SigurdOS_TDeck_remote_test_radio_usca.build_flags}
  -D SIGURDOS_REMOTE_TEST_RX_ONLY=1

[env:SigurdOS_TDeck_remote_test_radio_meshv2]
extends = env:SigurdOS_TDeck_remote_test_radio
build_flags =
  ${env:SigurdOS_TDeck_remote_test_radio.build_flags}
  -D SIGURDOS_MESH_V2=1

# GPS hardware validation harness. This boots only the GPS HAL and emits
# privacy-safe structured records over the ESP32-S3 USB Serial/JTAG port.
[env:SigurdOS_TDeck_companion_usb]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags =
  ${debug.build_unflags}
  -DSIGURDOS_COMPANION_BLE=1
  -DCORE_DEBUG_LEVEL=5
  -DCORE_DEBUG_LEVEL=2
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_COMPANION_USB=1
  -DSIGURDOS_COMPANION_BLE=0
  -DCORE_DEBUG_LEVEL=0
build_src_flags =
  -include diagnostics/companion_usb_console.h
build_src_filter =
  ${env:SigurdOS_TDeck.build_src_filter}
  +<../lib/meshcore/src/helpers/ArduinoSerialInterface.cpp>
  -<../lib/meshcore/src/helpers/esp32/SerialBLEInterface.cpp>
  -<comms/observed_ble_interface.cpp>
lib_ignore =
  ESP32 BLE Arduino
extra_scripts =
  ${env:SigurdOS_TDeck.extra_scripts}
  pre:scripts/companion_usb_build.py

[env:SigurdOS_TDeck_gps_validation]
extends = env:SigurdOS_TDeck
build_type = debug
build_unflags = ${debug.build_unflags}
build_flags =
  ${env:SigurdOS_TDeck.build_flags}
  ${debug.build_flags}
  -D SIGURDOS_GPS_VALIDATION=1
build_src_filter =
  -<*>
  +<validation/gps_validation.cpp>
  +<hal/gps.cpp>
  +<hal/storage.cpp>
lib_deps =
extra_scripts =
  pre:scripts/arduino_hwcdc_fix.py

# Compile/link probe for ESP32-only synchronization, RTC, OTA, sleep-board,
# and allocator branches that the native host and its sanitizers cannot see.
[env:SigurdOS_TDeck_esp32_components]
extends = env:SigurdOS_TDeck
build_src_filter =
  -<*>
  +<validation/esp32_component_compile.cpp>
extra_scripts =
  pre:scripts/arduino_hwcdc_fix.py

[env:SigurdOS_TDeck_gps_validation_wifi]
extends = env:SigurdOS_TDeck_gps_validation
build_flags =
  ${env:SigurdOS_TDeck_gps_validation.build_flags}
  -D SIGURDOS_GPS_VALIDATION_WIFI=1
build_src_filter =
  ${env:SigurdOS_TDeck_gps_validation.build_src_filter}
  +<validation/gps_validation_wifi.cpp>
extra_scripts =
  pre:scripts/arduino_hwcdc_fix.py
  pre:scripts/validation/gps_validation_wifi_flags.py

[env:native_test]
platform = native
test_framework = googletest
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Wno-unused-parameter
  -D MAX_CONTACTS=350
  -I src
  -I src/hal
  -I src/ui
  -I src/mesh
  -I src/app
  -I src/utils
  -I src/fonts
  -I test/mocks
  -I src/comms
  -I lib/meshcore/src
lib_deps =
  google/googletest @ 1.17.0
lib_ignore =
  MeshCore
build_src_filter =
  -<*>
  +<../test/mocks/mock_arduino.cpp>
  +<../test/mocks/mock_mesh_wrapper.cpp>
  +<../test/mocks/mock_prefs.cpp>
  +<../test/mocks/mock_fonts.cpp>
  +<../test/mocks/mock_esp_partition.cpp>
  +<../test/mocks/mock_spiffs.cpp>
  +<../test/mocks/native_build_main.cpp>
  +<ui/theme.cpp>
  +<ui/home_routes.cpp>
  +<ui/chat_history_store.cpp>
  +<ui/chat_message_buffer.cpp>
  +<ui/screen_loader.cpp>
  +<ui/screen_lifetime.cpp>
  +<hal/storage.cpp>
  +<hal/atomic_file.cpp>
  +<hal/launcher_env.cpp>
  +<hal/radio_profiles.cpp>
  +<hal/battery.cpp>
  +<hal/buzzer.cpp>
  +<hal/gps.cpp>
  +<hal/i2c_bus.cpp>
  +<hal/keyboard.cpp>
  +<hal/keyboard_layouts.cpp>
  +<hal/spi_shared.cpp>
  +<hal/trackball.cpp>
  +<hal/touch.cpp>
  +<hal/lv_pool.cpp>
  +<app/tile_cache.cpp>
  +<app/gps_track_log.cpp>
  +<diagnostics/diagnostic_io.cpp>
  +<fonts/emoji_font_setup.cpp>
  +<fonts/emoji_data.cpp>
  +<mesh/channel_validation.cpp>
  +<mesh/time_state.cpp>
  +<mesh/persistence_store.cpp>
  +<mesh/contact_store.cpp>
  +<mesh/message_store.cpp>
  +<mesh/telemetry_lpp_parser.cpp>
  +<hal/github_ota_plan.cpp>
  +<ui/channel_menu.cpp>
  +<comms/companion_bridge.cpp>
  +<../lib/meshcore/src/helpers/ArduinoSerialInterface.cpp>

# Production-linked MeshCore integration tests. The full embedded library build
# is ignored so this host target can selectively compile the pinned gitlink's
# packet, dispatcher, and pool sources against deterministic radio/clock fakes.
[env:native_mesh_integration]
platform = native
test_framework = googletest
test_filter = test_mesh_integration
test_build_src = yes
build_flags =
  -std=c++17
  -Wall -Wextra -Wno-unused-parameter
  -D SIGURDOS_MESHCORE_INTEGRATION=1
  -I lib/meshcore/test/mocks
  -I lib/meshcore/src
  -I lib/meshcore/src/helpers
lib_deps =
  google/googletest @ 1.17.0
lib_ignore =
  MeshCore
build_src_filter =
  -<*>
  +<../lib/meshcore/src/Dispatcher.cpp>
  +<../lib/meshcore/src/Packet.cpp>
  +<../lib/meshcore/src/Utils.cpp>
  +<../lib/meshcore/src/helpers/StaticPoolPacketManager.cpp>

[env:native_sanitize]
extends = env:native_test
build_flags =
  ${env:native_test.build_flags}
  -fsanitize=address,undefined
  -fno-omit-frame-pointer
  -fno-sanitize-recover=all

[env:native_tdeck_sleep]
extends = env:native_test
test_build_src = no
test_filter = test_tdeck_sleep
build_flags =
  ${env:native_test.build_flags}
  -D SIGURDOS_TDECK

[env:native_coverage]
extends = env:native_test
extra_scripts =
  pre:scripts/native_coverage_flags.py
build_flags =
  ${env:native_test.build_flags}
  --coverage
  -fno-inline
  -fno-elide-constructors
  -DTEST_COVERAGE=1
lib_deps =
  ${env:native_test.lib_deps}
build_src_filter =
  ${env:native_test.build_src_filter}
